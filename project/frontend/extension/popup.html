<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  :root{
    --bg:#0f1218; --card:#1b212c; --line:#252c39;
    --txt:#e6eaf2; --dim:#98a2b3; --mute:#6b7686;
    --accent:#4f8cff; --ok:#2fbf71; --warn:#e2a336; --err:#e5534b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    width:340px; font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;
    background:var(--bg); color:var(--txt); padding:14px;
  }
  header{display:flex;align-items:center;gap:9px;margin-bottom:14px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--mute)}
  .dot.on{background:var(--ok);box-shadow:0 0 0 4px rgba(47,191,113,.16)}
  .dot.off{background:var(--err);box-shadow:0 0 0 4px rgba(229,83,75,.16)}
  .dot.busy{background:var(--warn);box-shadow:0 0 0 4px rgba(226,163,54,.16);animation:p 1.1s infinite}
  @keyframes p{50%{opacity:.3}}
  header b{font-size:14px;font-weight:650}
  header a{margin-left:auto;color:var(--dim);font-size:12px;text-decoration:none}
  header a:hover{color:var(--accent)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
  .row{display:flex;gap:8px;align-items:center}
  .grow{flex:1}
  button{
    background:rgba(79,140,255,.14);color:var(--accent);border:1px solid rgba(79,140,255,.28);
    padding:7px 12px;border-radius:7px;cursor:pointer;font:inherit;font-size:12.5px;font-weight:550;
    transition:background .15s,transform .1s;
  }
  button:hover:not(:disabled){background:rgba(79,140,255,.24)}
  button:active:not(:disabled){transform:translateY(1px)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.ghost{background:none;border-color:var(--line);color:var(--dim)}
  button.ghost:hover:not(:disabled){background:#161b24;color:var(--txt)}
  button.danger{background:rgba(229,83,75,.12);border-color:rgba(229,83,75,.3);color:var(--err)}
  button.on{background:rgba(47,191,113,.12);border-color:rgba(47,191,113,.3);color:var(--ok)}
  #msg{font-size:12px;color:var(--dim);margin-top:9px;min-height:18px}
  #msg.ok{color:var(--ok)} #msg.err{color:var(--err)}
  label{display:block;margin-bottom:11px}
  label span{display:block;font-size:11.5px;color:var(--dim);margin-bottom:4px}
  input,select{
    width:100%;background:#161b24;border:1px solid var(--line);color:var(--txt);
    padding:7px 9px;border-radius:6px;font:inherit;font-size:12.5px;
  }
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.12)}
  h4{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.7px;margin-bottom:9px;font-weight:600}
  ul{list-style:none;max-height:150px;overflow-y:auto}
  li{display:flex;gap:7px;padding:5px 0;border-bottom:1px solid rgba(37,44,57,.6);font-size:11.5px}
  li:last-child{border-bottom:none}
  li .t{color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
  li.warn{color:var(--warn)} li.error{color:var(--err)} li.info{color:var(--dim)}
  .empty{color:var(--mute);font-size:11.5px;padding:6px 0}
</style>
</head>
<body>
<header>
  <div class="dot" id="dot"></div>
  <b>校园网自连</b>
  <a href="#" id="linkOptions">设置</a>
</header>

<div class="card">
  <div class="row">
    <button class="grow" id="btnToggle">开启监控</button>
    <button class="ghost" id="btnCheck">立即检测</button>
  </div>
  <div id="msg">加载中…</div>
</div>

<div class="card">
  <h4>门户</h4>
  <div class="row">
    <button class="ghost grow" id="btnPortal">打开门户登录页</button>
  </div>
</div>

<div class="card">
  <h4>最近事件</h4>
  <ul id="events"></ul>
  <div class="row" style="margin-top:9px">
    <button class="ghost" id="btnClear">清空日志</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

function send(msg) {
  return new Promise(resolve => chrome.runtime.sendMessage(msg, resolve));
}

function fmtTime(iso) {
  const d = new Date(iso);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function renderEvents(events) {
  const box = $('events');
  if (!events || !events.length) {
    box.innerHTML = '<li class="empty">暂无事件</li>';
    return;
  }
  box.innerHTML = events.slice(0, 20).map(e =>
    `<li class="${e.level}"><span class="t">${fmtTime(e.ts)}</span><span>${escapeHtml(e.message)}</span></li>`
  ).join('');
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

async function refresh() {
  const resp = await send({ type: 'getState' });
  if (!resp || !resp.ok) {
    $('msg').textContent = '后台未响应';
    $('msg').className = 'err';
    return;
  }
  const { state, settings } = resp;
  const { events = [] } = await chrome.storage.local.get(['events']);

  const dot = $('dot');
  if (state.checking) {
    dot.className = 'dot busy';
    $('msg').textContent = '检测中…';
    $('msg').className = '';
  } else if (state.online === true) {
    dot.className = 'dot on';
    $('msg').textContent = state.lastMessage || '网络已放行';
    $('msg').className = 'ok';
  } else if (state.online === false) {
    dot.className = 'dot off';
    $('msg').textContent = state.lastMessage || '网络已断';
    $('msg').className = 'err';
  } else {
    dot.className = 'dot';
    $('msg').textContent = '监控未开启';
    $('msg').className = '';
  }

  const on = !!settings.enabled;
  const btn = $('btnToggle');
  btn.textContent = on ? '停止监控' : '开启监控';
  btn.className = on ? 'danger grow' : 'on grow';
  $('btnPortal').disabled = !settings.portalUrl;

  renderEvents(events);
}

$('btnToggle').onclick = async () => {
  const resp = await send({ type: 'getState' });
  const on = resp.settings.enabled;
  const r = await send({ type: 'setEnabled', enabled: !on });
  $('msg').textContent = r.enabled ? '监控已开启' : '监控已关闭';
  $('msg').className = r.enabled ? 'ok' : '';
  refresh();
};

$('btnCheck').onclick = async () => {
  $('btnCheck').disabled = true;
  await send({ type: 'checkNow' });
  $('btnCheck').disabled = false;
  refresh();
};

$('btnPortal').onclick = async () => {
  const r = await send({ type: 'openPortal' });
  if (!r.ok) $('msg').textContent = r.error, $('msg').className = 'err';
  refresh();
};

$('btnClear').onclick = async () => {
  await send({ type: 'clearEvents' });
  refresh();
};

$('linkOptions').onclick = e => {
  e.preventDefault();
  chrome.runtime.openOptionsPage();
};

refresh();
setInterval(refresh, 4000);
</script>
</body>
</html>
