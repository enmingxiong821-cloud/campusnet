name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 作业只需要读代码，显式收到只读，不继承仓库默认的宽权限。
# codeql.yml 早就这么做了，这里原来漏了。
permissions:
  contents: read

# 同一分支连着推两次时，前一轮已经没意义了：让位给新的，省 runner 也省等待。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    # 名字里必须带 OS：同一版本在 ubuntu 与 windows 各跑一格，只写版本号会产出两个
    # 同名的检查（main 上实测每个版本都出现两次），而分支保护的必过检查是按名字匹配的，
    # 同名时 windows 那格的红会被 ubuntu 那格的绿顶掉——正是要防的那种漏网。
    name: ${{ matrix.os == 'windows-latest' && 'Windows' || 'Linux' }} Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    # 六格矩阵里任何一格挂住（探活用例真的去连网、或某个平台等超时）
    # 都会把整轮 CI 拖到 GitHub 的 6 小时上限；全套本地约 5 分钟，30 分钟够宽。
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装测试依赖
        run: python -m pip install --upgrade pip pytest pytest-cov

      - name: 语法检查
        run: python -m compileall -q project/backend/campusnet utils

      - name: 单元与接口测试
        env:
          PYTHONIOENCODING: utf-8
        # 覆盖率只统计 campusnet 包（测试代码本身不计入分母）。
        # 门禁卡 90%：当前约 92%，留 2 个点是为了跨平台漂移不至于天天红——
        # 平台相关的分支在测试里靠伪造 os.name / sys.platform 覆盖，
        # 两平台跑的是同一批分支，不该有系统差。
        # --junitxml 是给下一步用的：日志要登录才读得到，失败用例名只能靠注解带出来。
        run: >
          python -m pytest project/backend/tests -q
          --cov=campusnet --cov-report=term-missing --cov-fail-under=90
          --junitxml=pytest-report.xml

      - name: 失败用例名写成注解
        # 只在红的时候跑，绿的时候这一步是 skipped。
        # 未登录读 actions/runs|jobs/<id>/logs 一律 403，annotation 又只有
        # 「Process completed with exit code 1」，而 ::error:: 写出的注解公开可读——
        # 没有 gh 登录时，这是唯一能把失败用例名带出来的路。
        if: failure()
        shell: bash
        env:
          # 断言消息里常有中文，不设这个在 windows 上 print 会 UnicodeEncodeError。
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'PY'
          import pathlib
          import re
          import xml.etree.ElementTree as ET

          report = pathlib.Path("pytest-report.xml")
          if not report.exists():
              print("::warning::没有 pytest-report.xml，测试没跑到写报告那一步")
              raise SystemExit(0)
          found = 0
          for case in ET.parse(report).getroot().iter("testcase"):
              for kind in ("failure", "error"):
                  node = case.find(kind)
                  if node is None:
                      continue
                  found += 1
                  where = case.get("classname", "?") + "::" + case.get("name", "?")
                  # 消息里可能带 ANSI 色码，而 pytest 写 junit 时会把控制字符转成
                  # #x1B 这种字面量，两种形态都得去掉，注解只吃一行纯文本。
                  message = re.sub(r"(?:\x1b|#x1[bB])\[[0-9;]*m", "", node.get("message") or "")
                  message = re.sub(r"#x[0-9A-Fa-f]{2,4}", "", message)
                  message = " ".join(message.split())[:200]
                  # 注解正文里的 % 会被当成转义符，先换成 %25。
                  message = message.replace("%", "%25")
                  print("::error::FAILED " + where + " — " + message)
          if not found:
              print("::warning::没有失败用例，红在别处（多半是覆盖率门禁没到 90%）")
          PY

  console-browser:
    name: 控制台浏览器交互
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 安装浏览器测试依赖
        run: python -m pip install pytest playwright

      - name: 安装 Chromium 与系统依赖
        run: python -m playwright install --with-deps chromium

      - name: 验证桌面与移动宽度交互
        env:
          CAMPUSNET_BROWSER_CHANNEL: chromium
          PYTHONIOENCODING: utf-8
        run: python -m pytest project/backend/tests/test_console_browser.py -q

  extension:
    name: 浏览器扩展逻辑
    runs-on: ubuntu-latest
    # 这三步都是 node 本地跑，正常几十秒；给个上限免得异常时干等 6 小时。
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: 后台脚本语法检查
        run: node --check project/frontend/extension/background.js

      - name: manifest JSON 合法性
        run: node -e "JSON.parse(require('fs').readFileSync('project/frontend/extension/manifest.json','utf8'))"

      - name: 扩展逻辑测试
        run: node project/frontend/extension/test-background.js

  secrets:
    name: 仓库不得包含凭据
    runs-on: ubuntu-latest
    # git ls-files / git log --all 在大仓库里可能变慢，给个上限。
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 检查敏感文件是否被提交
        run: |
          set -e
          fail=0
          for pattern in '*.db' '*.db-wal' '*.db-shm' '.env' '*.key' 'config.json'; do
            if git ls-files --error-unmatch "$pattern" >/dev/null 2>&1; then
              echo "::error::敏感文件被提交: $pattern"
              fail=1
            fi
          done
          if git ls-files | grep -qiE 'password|secret|token' ; then
            echo "::warning::文件名含敏感关键词，请人工确认"
          fi
          exit $fail

      - name: 检查数据库与密钥是否可恢复
        run: |
          set -e
          # 数据库、备份、密钥、令牌、本地配置都不能出现在 git 历史里。
          # 用正则而不是精确路径：早先只写了 database/campusnet.db，
          # 结果 database/backup/*.db 被提交进历史却一路放行（已用 filter-branch 清除）。
          history=$(git log --all --name-only --pretty=format:)
          leaked=""
          for pattern in 'database/.*\.db$' '\.campusnet_obf\.key$' '\.api-token$' '^config\.json$'; do
            if printf '%s\n' "$history" | grep -Eq "$pattern"; then
              echo "::error::历史中存在匹配 $pattern 的敏感文件"
              leaked="$leaked $pattern"
            fi
          done
          if [ -n "$leaked" ]; then
            exit 1
          fi
          echo "历史中未发现敏感文件"

      - name: 扫描拟分发源码中的敏感内容
        run: python utils/check_distribution.py --repo .
