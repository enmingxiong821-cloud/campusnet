name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 顶层只给读：工作流级写权限会原样铺给每个作业，verify 里跑的是全量测试套件
# 与第三方 action，一旦某个 action 被投毒，拿到的就是能推 tag、发 Release 的
# 令牌。写权限下沉到真正要写的作业（build-image 推 GHCR、release 建 Release）。
# 注意作业级 permissions 是整体替换而非合并：写了 job 级就要把 contents 自己
# 再列一遍，否则 checkout 会因没有读权限而失败。
permissions:
  contents: read

jobs:
  verify:
    name: 发布前校验
    runs-on: ubuntu-latest
    # 这里跑的是与 ci.yml 同款的全量套件 + 覆盖率门禁，六格矩阵里一格挂住
    # 就会把整轮拖到 GitHub 的 6 小时上限；全套本地约 5 分钟，30 分钟够宽。
    # 原来这个工作流一个超时都没写（ci.yml 有四处）。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Python 测试
        env:
          PYTHONIOENCODING: utf-8
        # 与 ci.yml 同款门禁：tag 不一定打在 main 的绿色提交上（补发旧版本、
        # 直接往 tag 推提交都会绕过 CI），发布前这一遍是最后一道网。
        run: |
          python -m pip install --upgrade pip pytest pytest-cov
          python -m pytest project/backend/tests -q --cov=campusnet --cov-fail-under=90

      - name: 扩展测试
        run: |
          node --check project/frontend/extension/background.js
          node project/frontend/extension/test-background.js

      - name: 收集分发文件
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          # tag 与代码里的版本号必须一致。发版流程是先改 __version__、再推同名
          # tag，两处手工同步，漏改哪一处都不会有任何报错：包名、二进制名、Release
          # 标题全跟着 tag 走，而 `--version` 打出的是代码里那个——用户装完发现
          # 「2.2.0 的包里报 2.1.0」，或者 Release 标题写着旧版本号。
          # workflow_dispatch 干跑时 GITHUB_REF_NAME 是分支名，跳过。
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            PKG_VERSION="$(python -c 'import sys; sys.path.insert(0, "project/backend"); import campusnet; print(campusnet.__version__)')"
            if [ "$VERSION" != "$PKG_VERSION" ]; then
              echo "::error::tag v${VERSION} 与 campusnet.__version__=${PKG_VERSION} 不一致，先改齐版本号再发版"
              exit 1
            fi
          fi
          NAME="campusnet-${VERSION}"
          echo "NAME=${NAME}" >> "$GITHUB_ENV"
          mkdir -p "dist/${NAME}"
          # 注意：cp -r 不受 .gitignore 约束，本地 *.log 会被一起带进来
          cp -r project utils database/schema.sql database/config.example.yml README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md LICENSE install.bat install.sh install.ps1 "dist/${NAME}/"
          # 容器部署用的三个文件也随包发：解压后就能 docker compose up，
          # 不必再回仓库拿。.dockerignore 要跟着走——少了它，用户从解压目录
          # 构建时会把 config.json 一起 COPY 进镜像层。
          cp Dockerfile docker-compose.yml docker-compose.tailscale.yml .dockerignore "dist/${NAME}/"
          # 只发 README 真正引用的那几项：截图、自测指南、打包脚本。
          # 不能写 `cp -r doc` —— doc/ 下还有工作状态存档、实施方案这类内部文档，
          # 一旦带进包就是对外泄露内部记录（cp -r 不受 .gitignore 约束）。
          cp -r packaging "dist/${NAME}/"
          mkdir -p "dist/${NAME}/doc"
          cp -r doc/images "dist/${NAME}/doc/"
          cp "doc/自测指南.md" "dist/${NAME}/doc/"
          # README 里每个相对链接都必须真的在包里，否则解压后就是死链。
          # 只排除 http/mailto/页内锚点，其余一律当相对路径查——原来只查 doc/ 前缀，
          # CHANGELOG.md、CONTRIBUTING.md 这类根目录文档漏发过，谁都没拦住。
          for ref in $(grep -oE '\]\([^)]+\)' "dist/${NAME}/README.md" | sed -e 's/^](//' -e 's/)$//' | grep -vE '^(https?:|mailto:|#)'); do
            if [ ! -e "dist/${NAME}/${ref}" ]; then
              echo "::error::README 引用了未打包的文件: ${ref}"
              exit 1
            fi
          done
          # 反向：内部文档绝不能进包（含本机绝对路径与开发记录）。
          # 有人图省事写成 `cp -r doc` 时，这里当场拦下。
          for internal in 工作状态存档 实施方案 后续步骤 参考项目与资料整理 深度优化方案 资料汇编; do
            if find "dist/${NAME}/doc" -name "*${internal}*" | grep -q .; then
              echo "::error::内部文档被打进分发包: ${internal}"
              exit 1
            fi
          done
          # 测试与可选依赖不进包
          rm -rf "dist/${NAME}/project/backend/tests"
          # 抓包/验证工作区必须排除：cp -r 不受 .gitignore 约束，
          # 里面的明文账号口令与从门户抓下来的第三方 JS 会一起进包
          rm -rf "dist/${NAME}/utils/_tmp"
          rm -rf "dist/${NAME}/utils/tmp"
          # 本机私有敏感标识清单绝不能进包：cp -r 不受 .gitignore 约束，而这份
          # 清单本身就是要保密的地址与 SSID；留下来还会被下一步的 --root 扫描
          # 当成规则读出来，等于自己举报自己。
          rm -f "dist/${NAME}/utils/local_sensitive.txt"
          rm -rf "dist/${NAME}/.pytest_cache"
          find "dist/${NAME}" -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          find "dist/${NAME}" -name '.pytest_cache' -type d -exec rm -rf {} + 2>/dev/null || true
          find "dist/${NAME}" \( -name '*.log' -o -name '*.db' -o -name '*.db-wal' -o -name '*.key' \) -delete
          # Flutter 移动端（project/mobile）的构建产物不进包。源码照发——用户可以
          # 自己构建——但一次本地 APK 构建会在 build/ 与 android/.gradle/ 下留几百 MB
          # 中间物，能把分发包撑大一个量级（cp -r 不受 .gitignore 约束）。
          # local.properties 记的是本机 Android SDK 绝对路径，换台机器即失效，不该发。
          rm -rf "dist/${NAME}/project/mobile/build"
          rm -rf "dist/${NAME}/project/mobile/.dart_tool"
          rm -rf "dist/${NAME}/project/mobile/android/.gradle"
          rm -f "dist/${NAME}/project/mobile/android/local.properties"

      - name: 校验包内无凭据
        run: |
          set -e
          fail=0
          for pattern in '*.db' '*.db-wal' '*.key' 'config.json' '*.log'; do
            if find "dist/${NAME}" -name "$pattern" | grep -q .; then
              echo "::error::分发包含敏感文件: $pattern"
              fail=1
            fi
          done
          # APK 签名材料与产物都不该进包：.jks/.keystore 是密钥库本身，
          # key.properties 里是它的口令，泄了等于别人能签发冒充你的更新包；
          # *.apk/*.aab 是构建产物，本就该由 release.yml 自己产出，不该从仓库发。
          for pattern in '*.jks' '*.keystore' 'key.properties' '*.apk' '*.aab'; do
            if find "dist/${NAME}" -name "$pattern" | grep -q .; then
              echo "::error::分发包含签名材料或移动端产物: $pattern"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ]
          python utils/check_distribution.py --root "dist/${NAME}"


      - name: 打包
        run: |
          set -e
          cd dist
          zip -qr "${NAME}.zip" "${NAME}" -x '*.db' -x '__pycache__/*'
          sha256sum "${NAME}.zip" > "${NAME}.zip.sha256"
          ls -la "${NAME}.zip" "${NAME}.zip.sha256"
          echo "--- 包内顶层结构 ---"
          unzip -l "${NAME}.zip" | head -20

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: campusnet-release
          path: |
            dist/*.zip
            dist/*.zip.sha256
          retention-days: 30

  build-binary:
    name: 单文件 ${{ matrix.target }}
    needs: verify
    # tag 出正式产物；workflow_dispatch 用来在打 tag 之前先把四个平台各跑一遍，
    # 免得 Release 已经发出去了才发现某个平台编不出来。
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            binary: dist/campusnet.exe
          - os: ubuntu-24.04
            target: linux-x64
            binary: dist/campusnet
          # arm64 标签取自 actions/runner-images 的 README（`ubuntu-24.04-arm`），
          # 镜像名是 ubuntu-24.04-arm64，两者不同，别按镜像名写 runs-on。
          - os: ubuntu-24.04-arm
            target: linux-arm64
            binary: dist/campusnet
          # macos-14 在 runner-images 里已标 deprecated，arm64 现用 macos-15。
          - os: macos-15
            target: macos-arm64
            binary: dist/campusnet
    runs-on: ${{ matrix.os }}
    # PyInstaller + 冒烟验证，四个平台各一份，正常几分钟；给个上限免得异常时干等 6 小时。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 安装 PyInstaller
        run: python -m pip install pyinstaller

      - name: 构建单文件
        run: python -m PyInstaller packaging/campusnet.spec --noconfirm

      - name: 冒烟验证
        env:
          PYTHONIOENCODING: utf-8
        shell: bash
        run: |
          set -e
          BIN="${{ matrix.binary }}"
          test -x "$BIN" || test -f "$BIN"
          "$BIN" --version
          # 冻结后最容易静默出错的不是代码而是数据：profiles 目录没打进去，
          # 程序一声不响地变成「0 条规则」。必须断言确实读到规则了。
          "$BIN" profiles --validate | tee /tmp/profiles.txt
          grep -q '^\[OK  \]' /tmp/profiles.txt
          # doctor 不判退出码：它的返回码反映的是这台机器的用户状态
          # （没建过账号就是 FAIL），不是构建是否成功。
          "$BIN" doctor --no-probe || true

      - name: 收拢产物
        shell: bash
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p out
          DEST="out/campusnet-${VERSION}-${{ matrix.target }}"
          cp "${{ matrix.binary }}" "$DEST"
          if [ "${{ matrix.target }}" = "windows-x64" ]; then
            mv "$DEST" "$DEST.exe"
          else
            chmod +x "$DEST"
          fi
          ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: campusnet-bin-${{ matrix.target }}
          path: out/*
          retention-days: 30

  build-apk:
    name: 安卓安装包
    needs: verify
    # 与 build-binary 同理：tag 出正式产物，workflow_dispatch 用来在打 tag 之前
    # 先把这条链跑一遍——Flutter 与 Gradle 的坑不少，发出去才发现编不出来最糟。
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 首次要下 Flutter SDK 与 Android SDK 组件，再跑一次 Gradle，比别的作业慢。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # AGP 要 JDK 17 以上。ubuntu-latest 自带的那份版本会随镜像漂移，
      # 显式钉住——Flutter 对 JDK 版本是挑的。
      - name: 安装 JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: 取依赖
        working-directory: project/mobile
        run: flutter pub get

      # 与 verify 里 Python 那步同一个理由：tag 不一定打在 main 的绿色提交上，
      # mobile.yml 是另一条工作流、按路径触发，管不到这里。发布前再验一遍。
      - name: 静态分析
        working-directory: project/mobile
        run: dart analyze

      - name: 测试
        working-directory: project/mobile
        run: flutter test

      # 用仓库 Secrets 里的固定密钥签 APK。没有配置时退回调试签名：能装能用，
      # 但每次 runner 的调试密钥都不同，覆盖安装会失败（见 README 的说明）。
      - name: 准备 APK 签名材料
        working-directory: project/mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，本次 APK 使用调试签名；与上一版签名不同，覆盖安装会失败。"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/ci-release.jks
          # storeFile 相对 app/ 解析，所以写 ci-release.jks 而不是 app/…
          cat > key.properties <<EOF
          storePassword=${STORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=ci-release.jks
          EOF

      - name: 构建 APK
        working-directory: project/mobile
        run: |
          set -e
          # 版本号取自代码里那一个，不另存一份：tag 与 __version__ 的一致性
          # verify 已经查过，workflow_dispatch 干跑时没有 tag 可用，这样也编得出来。
          VERSION="$(python3 -c 'import sys; sys.path.insert(0, "../backend"); import campusnet; print(campusnet.__version__)')"
          echo "按版本 ${VERSION} 构建"
          # --build-name 覆盖 pubspec 里的占位版本，APK 里看到的版本号才跟发版对齐。
          # build-number 用运行序号：它必须是递增的整数，Android 靠它判断升级。
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number="$GITHUB_RUN_NUMBER"
          mkdir -p ../../out
          cp build/app/outputs/flutter-apk/app-release.apk \
             "../../out/campusnet-${VERSION}.apk"
          ls -la ../../out

      - uses: actions/upload-artifact@v7
        with:
          name: campusnet-apk
          path: out/*
          retention-days: 30

  build-image:
    name: 容器镜像 amd64+arm64
    needs: verify
    # 镜像推上 GHCR 就是对外发布，所以只有 tag 才 push；
    # workflow_dispatch 允许「只构建不推送」地干跑一遍——
    # 镜像依赖的基础镜像与 apt 都在外面，本地不一定能复现，
    # 打 tag 之前先让 CI 编一次，比发出去之后发现编不出来强。
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 多架构构建要跑 qemu 模拟 arm64，比本机慢得多；给足上限但别让它挂到 6 小时。
    timeout-minutes: 45
    # 顶层是 contents: read，这里只需再加一个 packages: write 去推 GHCR。
    # contents 仍要自己列一遍：作业级 permissions 是整体替换而不是合并。
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 标签在 shell 里拼：把 ${{ github.ref_name }} 直接插进 run 里是 Actions 的
      # 注入口子，走 env 传递。顺带把 :latest 只留给正式版——预发布（v2.1.0-rc1
      # 这类带连字符的）要是顶掉了 latest，docker compose pull 的人就拿到未定版了。
      - name: 生成镜像标签
        id: image_tags
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -e
          tags="ghcr.io/${GITHUB_REPOSITORY}:${REF_NAME}"
          case "$REF_NAME" in
            *-*) ;;
            *) tags="${tags},ghcr.io/${GITHUB_REPOSITORY}:latest" ;;
          esac
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      # 多架构镜像必须在一次构建里直接推送：buildx 没法把异架构产物 --load
      # 到本地（只有本机架构那份能加载），所以不能先构建再单独推。
      - name: 构建并推送
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.image_tags.outputs.tags }}

  release:
    name: 创建 Release
    needs: [verify, build-binary, build-image, build-apk]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15
    # 唯一需要写权限的作业：gh release create 要往仓库里建 Release。
    # 顶层只给 read，这里显式提权，范围就压在这一步上。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # download-artifact 故意留在 v4：release job 只在打 tag 时跑，workflow_dispatch
      # 干跑覆盖不到它，升上去就是把未验证的改动留给下一次真发布。下次发版时再升。
      - uses: actions/download-artifact@v4
        with:
          name: campusnet-release
          path: dist

      # pattern 只取单文件产物；merge-multiple 让四个平台的二进制平铺到一个目录，
      # 免得 gh release create 还要逐个展开子目录。
      - uses: actions/download-artifact@v4
        with:
          pattern: campusnet-bin-*
          path: dist/bin
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: campusnet-apk
          path: dist/apk

      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ls -la dist/bin dist/apk
          VERSION="${GITHUB_REF_NAME#v}"
          # 少一个平台就当场失败：Release 一旦发出去就很难收回，
          # 与其发一份残缺的，不如红在这里。
          for target in windows-x64 linux-x64 linux-arm64 macos-arm64; do
            if ! ls "dist/bin/campusnet-${VERSION}-${target}"* >/dev/null 2>&1; then
              echo "::error::缺少 ${target} 的单文件产物"
              exit 1
            fi
          done
          if ! ls "dist/apk/campusnet-${VERSION}.apk" >/dev/null 2>&1; then
            echo "::error::缺少安卓安装包 campusnet-${VERSION}.apk"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/campusnet-*.zip \
            dist/campusnet-*.zip.sha256 \
            dist/bin/* \
            dist/apk/* \
            --title "校园网自连 v${VERSION}" \
            --generate-notes
