name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: 发布前校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Python 测试
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest project/backend/tests -q

      - name: 扩展测试
        run: |
          node --check project/frontend/extension/background.js
          node project/frontend/extension/test-background.js

      - name: 收集分发文件
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="campusnet-${VERSION}"
          echo "NAME=${NAME}" >> "$GITHUB_ENV"
          mkdir -p "dist/${NAME}"
          # 注意：cp -r 不受 .gitignore 约束，本地 *.log 会被一起带进来
          cp -r project utils database/schema.sql database/config.example.yml README.md LICENSE install.bat install.sh install.ps1 "dist/${NAME}/"
          # 只发 README 真正引用的那几项：截图、自测指南、打包脚本。
          # 不能写 `cp -r doc` —— doc/ 下还有工作状态存档、实施方案这类内部文档，
          # 一旦带进包就是对外泄露内部记录（cp -r 不受 .gitignore 约束）。
          cp -r packaging "dist/${NAME}/"
          mkdir -p "dist/${NAME}/doc"
          cp -r doc/images "dist/${NAME}/doc/"
          cp "doc/自测指南.md" "dist/${NAME}/doc/"
          # README 里每个 doc/ 引用都必须真的在包里，否则解压后就是死链。
          # 以后加内部文档不会再误伤，漏发用户文档也会当场失败。
          for ref in $(grep -oE '\(doc/[^)]+\)' "dist/${NAME}/README.md" | tr -d '()'); do
            if [ ! -e "dist/${NAME}/${ref}" ]; then
              echo "::error::README 引用了未打包的文件: ${ref}"
              exit 1
            fi
          done
          # 反向：内部文档绝不能进包（含本机绝对路径与开发记录）。
          # 有人图省事写成 `cp -r doc` 时，这里当场拦下。
          for internal in 工作状态存档 实施方案 后续步骤 参考项目与资料整理 深度优化方案 资料汇编; do
            if find "dist/${NAME}/doc" -name "*${internal}*" | grep -q .; then
              echo "::error::内部文档被打进分发包: ${internal}"
              exit 1
            fi
          done
          # 测试与可选依赖不进包
          rm -rf "dist/${NAME}/project/backend/tests"
          # 抓包/验证工作区必须排除：cp -r 不受 .gitignore 约束，
          # 里面的明文账号口令与从门户抓下来的第三方 JS 会一起进包
          rm -rf "dist/${NAME}/utils/_tmp"
          rm -rf "dist/${NAME}/utils/tmp"
          rm -rf "dist/${NAME}/.pytest_cache"
          find "dist/${NAME}" -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          find "dist/${NAME}" -name '.pytest_cache' -type d -exec rm -rf {} + 2>/dev/null || true
          find "dist/${NAME}" \( -name '*.log' -o -name '*.db' -o -name '*.db-wal' -o -name '*.key' \) -delete

      - name: 校验包内无凭据
        run: |
          set -e
          fail=0
          for pattern in '*.db' '*.db-wal' '*.key' 'config.json' '*.log'; do
            if find "dist/${NAME}" -name "$pattern" | grep -q .; then
              echo "::error::分发包含敏感文件: $pattern"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ]
          python utils/check_distribution.py --root "dist/${NAME}"


      - name: 打包
        run: |
          set -e
          cd dist
          zip -qr "${NAME}.zip" "${NAME}" -x '*.db' -x '__pycache__/*'
          sha256sum "${NAME}.zip" > "${NAME}.zip.sha256"
          ls -la "${NAME}.zip" "${NAME}.zip.sha256"
          echo "--- 包内顶层结构 ---"
          unzip -l "${NAME}.zip" | head -20

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: campusnet-release
          path: |
            dist/*.zip
            dist/*.zip.sha256
          retention-days: 30

  build-exe:
    name: 单文件 EXE（Windows）
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 PyInstaller
        run: python -m pip install pyinstaller

      - name: 构建单文件 exe
        run: python -m PyInstaller packaging/campusnet.spec --noconfirm

      - name: 冒烟验证（版本 + 自检）
        env:
          PYTHONIOENCODING: utf-8
        run: |
          dist\campusnet.exe --version
          dist\campusnet.exe profiles --validate
          dist\campusnet.exe doctor --no-probe

      - name: 上传 exe
        uses: actions/upload-artifact@v4
        with:
          name: campusnet-exe
          path: dist/campusnet.exe
          retention-days: 30

  release:
    name: 创建 Release
    needs: [verify, build-exe]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: campusnet-release
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: campusnet-exe
          path: dist/exe

      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          mv dist/exe/campusnet.exe "dist/campusnet-${VERSION}-windows-x64.exe"
          gh release create "$GITHUB_REF_NAME" \
            "dist/campusnet-${VERSION}.zip" \
            "dist/campusnet-${VERSION}.zip.sha256" \
            "dist/campusnet-${VERSION}-windows-x64.exe" \
            --title "校园网自连 v${VERSION}" \
            --generate-notes
